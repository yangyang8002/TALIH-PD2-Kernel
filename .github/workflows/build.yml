name: Build TALIH-PD2 (5.15 GKI + KSU, KASLR off for bisect)

on:
  push:
    branches: [5.15-gki-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Checkout SukiSU-Ultra (KernelSU) into KernelSU/
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          git -C KernelSU checkout 0ca744a88835144c58d8256ebb32c279edabfcde

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm libelf-dev libssl-dev \
            zlib1g-dev flex bison bc pahole
          clang --version | head -2

      - name: Configure (talpd_defconfig = server .config, KASLR off)
        run: |
          export ARCH=arm64 LLVM=1
          make talpd_defconfig
          scripts/config --disable RANDOMIZE_BASE
          make olddefconfig
          grep -E '^CONFIG_KSU=|^CONFIG_COMMON_CLK_MT6893|^CONFIG_PINCTRL_MT6885|^CONFIG_LTO_CLANG|^CONFIG_RANDOMIZE_BASE' .config | sort

      - name: Build kernel Image (ThinLTO link)
        run: |
          export ARCH=arm64 LLVM=1
          make -j$(nproc) Image 2>&1 | tail -40

      - name: Verify artifacts
        run: |
          ls -la vmlinux arch/arm64/boot/Image
          echo "=== boot-marker symbols ==="
          grep -E ' boot_mark(|_early|_late)?' System.map || true
          nm vmlinux | grep -E ' boot_crash| hbe_buf' || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux
          path: |
            vmlinux
            arch/arm64/boot/Image
          if-no-files-found: error
